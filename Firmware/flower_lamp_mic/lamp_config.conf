# 麦克风律动花灯的编译期配置。
# 使用 bash burst/flash.sh 或 bash burst/flash.sh -c 编译时会自动读取本文件。
# 参数名会在编译时转成 FLOWER_LAMP_<大写参数名> 宏，固件运行时不会读取本文件。

# --- 引脚 ---
# UV 灯驱动控制脚，接 CN5711 CE。
lamp_pin=23

# MAX9814 OUT 接 ESP32 ADC1 输入脚。
mic_pin=34

# 模式按钮输入脚，按钮另一端接 GND。
mode_button_pin=27

# --- PWM 与亮度 ---
# PWM 频率，过低会闪烁，过高可能降低驱动响应余量。
pwm_frequency_hz=1000

# PWM 分辨率；8 bit 对应 duty 0..255。
pwm_resolution_bits=8

# 最大亮度百分比，用于限制 UV 灯输出上限。
max_brightness_percent=98

# 声控和呼吸模式的最低亮度百分比。
breath_floor_percent=1

# 固定呼吸模式的最高亮度百分比。
breath_peak_percent=35

# 常亮低亮模式的固定亮度百分比。
steady_brightness_percent=18

# --- 音频采样与校准 ---
# 每帧 RMS 计算窗口，越短越灵敏，越长越稳定。
sample_window_ms=12

# 开机底噪校准时长。
calibration_ms=2000

# 底噪估计中加入多少倍 RMS 抖动标准差，避免估计偏低。
noise_floor_stddev_multiplier=1.5

# 底噪估计额外安全余量，单位是 ADC RMS 计数。
noise_floor_margin_rms=4.0

# 运行时底噪向上自适应速度；只在接近底噪的小信号时生效。
noise_floor_adapt_alpha=0.0

# 当前 RMS 不高于底噪这么多时，允许把底噪慢慢向上追。
noise_floor_adapt_max_rise_rms=40.0

# 进入声控模式后，先等待麦克风/ADC/按键扰动稳定，再开始底噪校准。
sound_reactive_pre_calibration_settle_ms=1200

# 声控模式校准结束后的稳定期；期间只预热基线，不触发律动。
sound_reactive_settle_ms=400

# ADC 定时采样频率；8000 Hz 时 25 ms 窗口约 200 个样本。
sample_rate_hz=8000

# --- 声音包络 ---
# 直流中心跟踪速度，用来去掉麦克风输出偏置。
dc_center_alpha=0.004

# 声压包络上升速度；越大越快响应鼓点。
pressure_attack_alpha=0.65

# 声压包络下降速度；越小回落越慢。
pressure_release_alpha=0.14

# 亮度上升速度；越大灯越跟手。
brightness_attack_alpha=0.45

# 亮度下降速度；越小余辉越长。
brightness_release_alpha=0.09

# 动态响度上限回落速度。
ceiling_decay_alpha=0.0012

# 底噪门限倍率，和偏移量一起取较大值；调高可减少安静误触发。
noise_gate_multiplier=1.15

# 底噪门限偏移，单位是 ADC RMS 计数。
noise_gate_offset=6.0

# 初始动态响度上限相对底噪的倍率。
ceiling_headroom_multiplier=5.5

# 最小有效响度映射区间，避免过安静时过度放大噪声。
min_pressure_range=24.0

# 超过底噪门限后还要再高出这段 RMS 才开始律动。
loudness_activation_rms=3.0

# 进入第 1 个响度档还要达到的有效 RMS，避免刚过门限就跳档。
loudness_first_level_rms=6.0

# --- 对数档位映射 ---
# 有效 RMS 对数化后的响度档数。
loudness_level_count=11

# PWM 亮度档数。
brightness_level_count=8

# 响度档位滞回，避免临界点来回跳档。
loudness_hysteresis_levels=0.2

# 亮度档位曲线；越大，低档越暗，高档冲击越明显。
brightness_level_gamma=1.6

# --- 强拍瞬态脉冲 ---
# 是否启用强拍瞬态脉冲；0 关闭，1 开启。
transient_enabled=0

# 瞬态检测的慢速能量基线更新速度。
transient_baseline_alpha=0.04

# 当前有效 RMS 超过慢速基线多少倍时，认为可能是强拍。
transient_threshold_multiplier=1.5

# 当前有效 RMS 至少要比基线高出这段数值，避免安静噪声触发。
transient_min_rise_rms=80.0

# 强拍触发时脉冲目标亮度。
transient_pulse_percent=85

# 脉冲亮度每帧回落速度；越大闪得越短。
transient_pulse_decay_alpha=0.10

# 强拍最短间隔，避免同一拍被连续触发。
transient_cooldown_ms=100

# --- 按钮与固定呼吸 ---
# 模式按钮消抖时间。
button_debounce_ms=35

# 固定呼吸模式完整明暗周期。
breath_period_ms=4800

# --- 调试 ---
# 设为 1 时通过串口输出 RMS、底噪、门限和档位。
debug_serial_enabled=0

# 串口诊断输出间隔。
debug_serial_interval_ms=500
