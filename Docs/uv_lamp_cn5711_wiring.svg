<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1060" viewBox="0 0 1500 1060">
  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #172033; }
      .title { font-size: 30px; font-weight: 700; }
      .section { font-size: 22px; font-weight: 700; }
      .label { font-size: 17px; font-weight: 700; }
      .small { font-size: 15px; }
      .tiny { font-size: 13px; }
      .wire { fill: none; stroke: #1f2937; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
      .power { stroke: #dc2626; }
      .ground { stroke: #111827; }
      .signal { stroke: #2563eb; }
      .part { fill: #ffffff; stroke: #1f2937; stroke-width: 3; }
      .board { fill: #182033; stroke: #0f172a; stroke-width: 4; }
      .pin { fill: #ffffff; stroke: #64748b; stroke-width: 2; }
      .powerlabel { fill: #fff1f2; stroke: #dc2626; stroke-width: 2; }
      .groundlabel { fill: #f8fafc; stroke: #111827; stroke-width: 2; }
      .signallabel { fill: #eef2ff; stroke: #2563eb; stroke-width: 2; }
      .driverlabel { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 2; }
      .note { fill: #fff8db; stroke: #d6a500; stroke-width: 2; }
      .danger { fill: #fff1f2; stroke: #e11d48; stroke-width: 2; }
      .tag { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
    </style>
  </defs>

  <rect x="0" y="0" width="1500" height="1060" fill="#f7f9fc" />
  <text x="60" y="56" class="title">ESP32 控制 3W UV 灯接线图：只用 CN5711 恒流驱动</text>

  <line x1="64" y1="92" x2="122" y2="92" class="wire power" />
  <text x="138" y="98" class="small">红线：VIN / 5V / LED+</text>
  <line x1="370" y1="92" x2="428" y2="92" class="wire ground" />
  <text x="444" y="98" class="small">黑线：GND / LED-</text>
  <line x1="650" y1="92" x2="708" y2="92" class="wire signal" />
  <text x="724" y="98" class="small">蓝线：GPIO23 -> CE 控制信号</text>

  <!-- ESP32 board -->
  <rect x="70" y="170" width="310" height="520" rx="18" class="board" />
  <rect x="166" y="196" width="120" height="72" rx="8" fill="#313b55" stroke="#64748b" stroke-width="2" />
  <text x="174" y="238" class="small" fill="#ffffff">ESP-WROOM-32</text>
  <rect x="174" y="618" width="104" height="42" rx="9" fill="#cbd5e1" stroke="#94a3b8" stroke-width="2" />
  <text x="199" y="645" class="small">USB</text>
  <text x="132" y="720" class="section">ESP32 Dev Board</text>

  <rect x="108" y="235" width="210" height="52" rx="8" class="signallabel" />
  <text x="130" y="257" class="label">GPIO23 / MOSI</text>
  <text x="130" y="280" class="small">PWM 输出，接模块 CE</text>
  <circle cx="380" cy="260" r="11" class="pin" />

  <rect x="108" y="430" width="180" height="44" rx="8" class="powerlabel" />
  <text x="130" y="458" class="label" fill="#dc2626">VIN / 5V 引脚</text>
  <circle cx="380" cy="452" r="11" class="pin" />

  <rect x="108" y="565" width="180" height="44" rx="8" class="groundlabel" />
  <text x="130" y="593" class="label">GND 引脚</text>
  <circle cx="380" cy="587" r="11" class="pin" />

  <!-- CN5711 actual module -->
  <rect x="650" y="235" width="300" height="420" rx="18" class="part" />
  <text x="730" y="276" class="section">CN5711 模块</text>
  <text x="688" y="306" class="small">按照片右侧焊盘自上而下：</text>
  <rect x="700" y="330" width="200" height="92" rx="10" class="driverlabel" />
  <text x="726" y="358" class="label">LED / G / CE / VI</text>
  <text x="722" y="386" class="small">先调到 500-600mA</text>
  <text x="722" y="406" class="small">不要再串 3Ω 电阻</text>

  <!-- CN5711 right-side pads in the same order as photo -->
  <circle cx="950" cy="330" r="10" class="pin" />
  <rect x="968" y="290" width="86" height="28" rx="7" class="tag" />
  <text x="982" y="309" class="tiny" fill="#dc2626">LED 输出+</text>

  <circle cx="950" cy="420" r="10" class="pin" />
  <rect x="968" y="380" width="86" height="28" rx="7" class="tag" />
  <text x="997" y="399" class="tiny">G 地</text>

  <circle cx="950" cy="510" r="10" class="pin" />
  <rect x="968" y="470" width="86" height="28" rx="7" class="tag" />
  <text x="1001" y="489" class="tiny" fill="#2563eb">CE</text>

  <circle cx="950" cy="600" r="10" class="pin" />
  <rect x="968" y="560" width="86" height="28" rx="7" class="tag" />
  <text x="987" y="579" class="tiny" fill="#dc2626">VI 输入+</text>

  <circle cx="800" cy="655" r="10" class="pin" />
  <text x="762" y="692" class="label">ISET</text>
  <text x="710" y="714" class="small">模块已调好则不用外接</text>

  <!-- UV LED -->
  <rect x="1190" y="258" width="220" height="156" rx="14" class="part" />
  <text x="1254" y="293" class="label">3W UV LED</text>
  <text x="1230" y="327" class="small">左侧：正极 +</text>
  <text x="1230" y="353" class="small">下侧：负极 -</text>
  <text x="1224" y="388" class="small">必须贴散热片</text>
  <circle cx="1190" cy="330" r="10" class="pin" />
  <rect x="1158" y="288" width="44" height="34" rx="8" class="tag" />
  <text x="1173" y="311" class="label" fill="#dc2626">+</text>
  <circle cx="1300" cy="414" r="10" class="pin" />
  <rect x="1316" y="396" width="44" height="34" rx="8" class="tag" />
  <text x="1332" y="419" class="label">-</text>

  <!-- Wires: all routed outside modules -->
  <path d="M950 330 H1190" class="wire power" />
  <path d="M380 452 H470 V760 H1160 V600 H950" class="wire power" />
  <path d="M950 420 H1140 V790 H520 V587 H380" class="wire ground" />
  <path d="M1300 414 V790 H1140" class="wire ground" />

  <!-- CE signal and pulldown -->
  <path d="M380 260 H515" class="wire signal" />
  <rect x="515" y="240" width="86" height="40" rx="9" class="part" />
  <text x="536" y="266" class="small">100Ω</text>
  <path d="M601 260 H610 V215 H1080 V510 H950" class="wire signal" />
  <rect x="450" y="130" width="338" height="38" rx="8" class="signallabel" />
  <text x="472" y="155" class="small">GPIO23 可直接或经 100Ω~220Ω 接模块 CE</text>

  <path d="M1080 510 V640 H1168" class="wire signal" />
  <rect x="1168" y="618" width="78" height="44" rx="9" class="part" />
  <text x="1182" y="646" class="small">100kΩ</text>
  <path d="M1207 662 V790" class="wire ground" />
  <rect x="650" y="630" width="305" height="38" rx="8" class="signallabel" />
  <text x="672" y="655" class="small">CE 到 G 下拉，防止上电误亮</text>

  <rect x="70" y="830" width="650" height="92" rx="10" class="danger" />
  <text x="94" y="864" class="label">注意</text>
  <text x="94" y="891" class="small">CN5711 负责恒流，GPIO23 控制 CE 开关或 PWM 调光。</text>
  <text x="94" y="913" class="small">PWM 频率建议低于 2kHz；当前固件 1kHz 可以用。UV 灯不要直视。</text>

  <rect x="70" y="948" width="1280" height="78" rx="10" class="note" />
  <text x="94" y="980" class="small">接线顺序：VIN -&gt; 模块 VI；GND -&gt; 模块 G；模块 LED -&gt; UV灯+；UV灯- -&gt; GND。所有 GND 必须共地。</text>
  <text x="94" y="1006" class="small">GPIO23 -&gt; 100Ω -&gt; 模块 CE；CE -&gt; 100kΩ -&gt; G。CN5711 电流先调到 500-600mA。</text>
</svg>
